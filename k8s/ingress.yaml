apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pr-reviewer
  namespace: pr-reviewer
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - PUBLIC_HOST
      secretName: review-tls
  rules:
    - host: PUBLIC_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pr-reviewer
                port:
                  number: 80
